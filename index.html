  background-repeat: repeat-y;
  background-position: top center;
  background-size: 100% auto;
  background-color: var(--felt-deep);
  min-height:100vh; font-family:'Zen Kaku Gothic New', sans-serif; color:var(--ink);
  padding: 22px 14px 60px;
}
.wrap{ max-width: 1100px; margin:0 auto; }
.masthead{ text-align:center; margin-bottom:16px; }
.view-only-banner{ background:#3a2f14; color:#f0d98c; border:1px solid var(--gold); border-radius:8px; padding:8px 12px; text-align:center; font-weight:700; font-size:13px; margin-bottom:10px; }
.masthead .stamp{
  display:inline-block; font-family:'Shippori Mincho', serif; font-weight:800; font-size:24px;
  letter-spacing:.1em; border:2px solid var(--gold); border-radius:10px; padding:5px 18px; position:relative;
}
.masthead .stamp::before{ content:''; position:absolute; inset:4px; border:1px solid rgba(199,163,85,.4); border-radius:7px; }
.masthead .sub{ margin-top:6px; font-size:10.5px; letter-spacing:.2em; color:rgba(34,31,25,.5); font-family:'Zen Kaku Gothic New',sans-serif; font-variant-numeric:tabular-nums; }

.tabs{ display:flex; gap:8px; justify-content:center; margin-bottom:18px; }
.tabs button{
  background: rgba(255,255,255,.6); border:1px solid var(--felt-line); color: var(--ink);
  padding:9px 20px; border-radius:999px; font-family:inherit; font-weight:700; font-size:13.5px; cursor:pointer;
}
.tabs button.active{ background: var(--gold); color:#241d0e; border-color:var(--gold); }

.card{ background:var(--tile); color:var(--ink); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow); margin-bottom:16px; }
.card h2{
  font-family:'Shippori Mincho', serif; font-size:15.5px; margin:0 0 12px; color:var(--ink);
  border-left:4px solid var(--red); padding-left:9px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
}
.card h2 .h2sub{ font-size:10.5px; color:var(--ink-soft); font-weight:400; font-family:'Zen Kaku Gothic New',sans-serif; }

.topline{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
.topline .field{ flex:1; min-width:100px; }
.field label{ display:block; font-size:10.5px; color:var(--ink-soft); margin-bottom:3px; font-weight:700; }
.field input{ width:100%; padding:7px 9px; border:1px solid #d8cfb6; border-radius:7px; font-size:13.5px; font-family:inherit; background:#fffdf8; color:var(--ink); }
.field input:focus{ outline:2px solid var(--jade); outline-offset:1px; }

.names-row{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:4px; }
.name-box{ text-align:center; }
.name-box input{ text-align:center; font-weight:800; width:100%; padding:7px 9px; border:1px solid #d8cfb6; border-radius:7px; font-family:inherit; font-size:13.5px; background:#fffdf8; color:var(--ink); }
.avg-rank-badge{ display:inline-block; margin-top:5px; font-size:11px; font-family:'Zen Kaku Gothic New',sans-serif; font-variant-numeric:tabular-nums; background:#e7ddc4; color:var(--ink-soft); padding:2px 8px; border-radius:999px; }

/* ---- layout grid ---- */
.layout-grid{ display:grid; grid-template-columns: 1.5fr 1fr; gap:16px; align-items:start; }
@media (max-width:820px){ .layout-grid{ grid-template-columns:1fr; } }

.title-signboard{
  display:flex; align-items:center; gap:10px; justify-content:center;
  margin-bottom:14px; background:#f0e9d6; border:2px solid var(--gold); border-radius:10px; padding:10px 16px;
}
.title-signboard label{ font-family:'Shippori Mincho',serif; font-weight:700; font-size:13px; color:var(--ink-soft); flex-shrink:0; }
.title-signboard input{
  flex:1; font-family:'Shippori Mincho',serif; font-weight:800; font-size:17px; color:var(--ink);
  text-align:center; border:none; background:transparent; outline:none; padding:4px 6px;
}
.title-signboard input:focus{ background:#fffdf8; border-radius:6px; }

/* ---- score table（1枚のテーブルに素点とポイントを同じ<tr>で並べ、行の高さのズレを根絶） ---- */
table.score-table{ width:100%; border-collapse:collapse; font-size:12.5px; table-layout:fixed; }
table.score-table th{
  background:#e7ddc4; color:var(--ink); font-family:'Zen Kaku Gothic New',sans-serif; font-variant-numeric:tabular-nums; font-weight:700;
  font-size:10.5px; padding:4px 3px; text-align:center; border:1px solid #c9bd9e;
}
table.score-table td{ height:30px; padding:1px 3px; text-align:center; vertical-align:middle; border:1px solid #c9bd9e; box-sizing:border-box; background:#fff; }
table.score-table td.idx{ font-family:'Zen Kaku Gothic New',sans-serif; font-variant-numeric:tabular-nums; color:var(--ink-soft); font-size:10.5px; width:34px; cursor:pointer; white-space:nowrap; }
table.score-table td.date-cell{ font-size:9.5px; width:32px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
table.score-table th.th-date{ width:32px; }
table.score-table td.pt-divider, table.score-table th.pt-divider{ border-left:2px solid var(--gold); }
.date-tag-badge{ font-size:10px; color:var(--gold); font-weight:900; white-space:nowrap; margin-right:3px; text-shadow: 0 0 1px rgba(199,163,85,.4); }
input.raw-input{
  width:100%; max-width:80px; height:26px; box-sizing:border-box; padding:0 2px; border:1px solid #d8cfb6; border-radius:5px; text-align:center;
  font-family:'Zen Kaku Gothic New',sans-serif; font-variant-numeric:tabular-nums; font-size:15px; font-weight:700; background:#fff; color:var(--ink); line-height:24px;
}
input.raw-input:focus{ outline:2px solid var(--jade); }
input.raw-input.auto-filled{ font-style:italic; border-style:dashed; }
input.raw-input.val-low{ color:var(--red); }
.pt-badge{ display:inline-block; height:24px; line-height:24px; vertical-align:middle; font-family:'Zen Kaku Gothic New',sans-serif; font-variant-numeric:tabular-nums; font-size:13.5px; font-weight:700; }
.pt-badge.pos{ color:var(--jade); } .pt-badge.neg{ color:var(--red); } .pt-badge.zero{ color:var(--ink-soft); }
tr.row-warn td.idx{ color:var(--red); }
tr.row-warn{ background: rgba(179,57,44,.06); }
tfoot td{ font-weight:800; font-family:'Zen Kaku Gothic New',sans-serif; font-variant-numeric:tabular-nums; background:#f0e9d6; padding:6px 4px; height:auto; }
tfoot td.tfoot-label{ font-size:10.5px; line-height:1.3; text-align:center; }
tfoot td.pos{ color:var(--jade); } tfoot td.neg{ color:var(--red); }
tr.tfoot-yen td{ background:#efe6d2; font-size:12px; }

<body>
<div class="wrap">
  <div class="masthead">
    <div class="stamp">麻雀成績表</div>
    <div class="sub">3-PLAYER HANCHAN LEDGER</div>
  </div>
  <div id="viewOnlyBanner"></div>
  <div class="tabs no-print" id="tabs"></div>
  <div id="app"></div>
</div>

<script>
const STORAGE_KEY = 'mahjong3-ledger:state';
const ROWS = 33;
let state = null;
let currentView = 'home'; // 'home' | 'score' | 'archive'
const VIEW_ONLY = new URLSearchParams(location.search).get('view') === '1'; // URLに ?view=1 を付けると閲覧専用モードになる

function defaultState(){
  return {
    players: ['佐々木','村上','小林'],
    rate: 50,
    savingsPerPerson: 1000,
    hanchans: Array.from({length:ROWS}, ()=> ({vals:[null,null,null], auto:[false,false,false]})),
    chipSessions: [], // {round, chips:[n,n,n]}
    todayRange: {from:1, to:33},
    saveTitle: '', // スコア入力画面の「看板」に手入力するタイトル
    folders: [] // タイトルごとのフォルダ：{title, entries:[{savedAt, hanchans, chipSessions, players, rate, savingsPerPerson}]}
  };
}

function chipMultiplier(round){
  const r = Number(round);
  if(round===undefined || round===null || round==='' || isNaN(r)) return 2; // 未設定時は1〜20回戦扱い
  return r <= 20 ? 2 : 4;
}
function chipPointValue(count, round){
  if(count===null || count===undefined) return null;
  return count * chipMultiplier(round);
}

/* ---- storage adapter ----
   みんなで同じ記録を見られるよう「共有(shared)」保存を使う。
   Claude.aiのアーティファクト外（ダウンロードして直接開いた場合など）で
   window.storageが使えない場合は、その端末内だけのlocalStorageに自動で切り替える。 */
async function storageGet(key){
  try{
    if(window.storage && typeof window.storage.get==='function'){
      const res = await window.storage.get(key, true);
      return res ? res.value : null;
    }
  }catch(e){ /* fall through to localStorage */ }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  try{
    if(window.storage && typeof window.storage.set==='function'){
      await window.storage.set(key, value, true);
      return true;
    }
  }catch(e){ /* fall through to localStorage */ }
  try{ localStorage.setItem(key, value); return true; }catch(e){ return false; }
}

async function loadState(){
  let raw = null;
  try{ raw = await storageGet(STORAGE_KEY); }catch(e){ raw = null; }
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = null; } }
  if(!state) state = defaultState();
  state.hanchans = (state.hanchans||[]).map(r=> Array.isArray(r) ? {vals:r, auto:[false,false,false]} : r);
  while(state.hanchans.length < ROWS) state.hanchans.push({vals:[null,null,null], auto:[false,false,false]});
  state.chipSessions = state.chipSessions || [];
  state.chipSessions.forEach(s=>{ if(s.round===undefined) s.round=''; });
  state.todayRange = state.todayRange || {from:1, to:33};
  state.saveTitle = state.saveTitle || '';
  state.folders = state.folders || [];
  render();
}
async function saveState(){
  const ok = await storageSet(STORAGE_KEY, JSON.stringify(state));
  if(!ok) console.error('保存失敗');
}

/* ---------- core math ---------- */
function round561(raw){
  if(raw===null || raw===undefined || raw==='' || isNaN(raw)) return null;
  raw = Math.round(raw);
  // マイナスも含めて絶対値で判定する（例：-500→0扱い、-600→-1000扱い。+500→0、+600→1000と対称）
  const sign = raw < 0 ? -1 : 1;
  const mag = Math.abs(raw);
  const remainder = mag % 1000;
  const hundreds = Math.floor(remainder/100);
  const roundedMag = hundreds <= 5 ? (mag - remainder) : (mag - remainder + 1000);
  return roundedMag===0 ? 0 : sign * roundedMag; // -0を避けて必ず0を返す
}

// 着順は「丸める前」の実際の素点で決める。1着はそのまま、2着・3着だけ5捨6入する。
function computePoints(raws){
  if(raws.some(r=> r===null || r===undefined || isNaN(r))) return [null,null,null];
  const order = [0,1,2].slice().sort((a,b)=> raws[b]-raws[a]);
  const adjusted = raws.slice();
  adjusted[order[1]] = round561(raws[order[1]]);
  adjusted[order[2]] = round561(raws[order[2]]);
  // order[0]（1着）は5捨6入しない。2着・3着の丸め後点数から逆算し、常に合計0になるようにする
  const baseline = [0,0,0];
  baseline[order[1]] = (adjusted[order[1]]-40000)/1000;
  baseline[order[2]] = (adjusted[order[2]]-40000)/1000;
  baseline[order[0]] = -(baseline[order[1]] + baseline[order[2]]);
  const rank2Value = raws[order[1]]; // ウマ判定は丸める前の実際の素点で行う
  const umaTable = rank2Value >= 40000 ? [30,-5,-25] : [40,-15,-25];
  const pts = [0,0,0];
  order.forEach((idx, rankPos)=>{ pts[idx] = baseline[idx] + umaTable[rankPos]; });
  return pts;
}

function computeRanks(raws){
  if(raws.some(r=> r===null || r===undefined || isNaN(r))) return [null,null,null];
  const order = [0,1,2].slice().sort((a,b)=> raws[b]-raws[a]);
  const ranks=[0,0,0];
  order.forEach((idx,rankPos)=> ranks[idx]=rankPos+1);
  return ranks;
}

function fmt(n){
  if(n===null || n===undefined || isNaN(n)) return '';
  const s = Math.abs(Math.round(n)).toLocaleString('ja-JP');
  return (n<0?'−':(n>0?'+':'')) + s;
}
function fmtAbs(n){ if(n===null||n===undefined||isNaN(n)) return ''; return Math.round(n).toLocaleString('ja-JP'); }

function pointsTotals(hanchans){
  const totals=[0,0,0];
  (hanchans||state.hanchans).forEach(r=>{
    const pts = computePoints(r.vals);
    pts.forEach((p,i)=>{ if(p!==null) totals[i]+=p; });
  });
  return totals;
}
function rangeSum(from, to){
  const totals=[0,0,0];
  state.hanchans.forEach((h,i)=>{
    const num = i+1;
    if(num<from || num>to) return;
    const pts = computePoints(h.vals);
    pts.forEach((p,k)=>{ if(p!==null) totals[k]+=p; });
  });
  return totals;
}
function rangeChipSum(from, to){
  const totals=[0,0,0];
  state.chipSessions.forEach(s=>{
    const r = Number(s.round);
    if(isNaN(r) || r<from || r>to) return;
    s.chips.forEach((c,k)=> totals[k]+= chipPointValue(c||0, s.round));
  });
  return totals;
}
function chipPointTotals(chipSessions){
  const totals=[0,0,0];
  (chipSessions||state.chipSessions).forEach(s=> s.chips.forEach((c,i)=> totals[i]+= chipPointValue(c||0, s.round) ));
  return totals;
}
function averageRanks(hanchans){
  const sums=[0,0,0], counts=[0,0,0];
  (hanchans||state.hanchans).forEach(h=>{
    const ranks = computeRanks(h.vals);
    ranks.forEach((r,i)=>{ if(r!==null){ sums[i]+=r; counts[i]++; } });
  });
  return [0,1,2].map(i=> counts[i]? (sums[i]/counts[i]) : null);
}
function fmtAvgRank(v){ return v===null ? '−' : v.toFixed(2)+'位'; }

// 全フォルダの最新保存 + 現在のスコア表を合わせた「通算」平均着順
// （今のタイトルと同じフォルダは、現在の表と二重にならないよう除外する）
function allTimeAverageStats(){
  const sums=[0,0,0], counts=[0,0,0];
  const currentTitle = (state.saveTitle||'').trim();
  const otherFoldersLatest = (state.folders||[])
    .filter(f=> f.title!==currentTitle)
    .map(f=> f.entries[f.entries.length-1].hanchans);
  const allSets = [...otherFoldersLatest, state.hanchans];
  allSets.forEach(hanchans=>{
    hanchans.forEach(h=>{
      const ranks = computeRanks(h.vals);
      ranks.forEach((r,i)=>{ if(r!==null){ sums[i]+=r; counts[i]++; } });
    });
  });
  return [0,1,2].map(i=> counts[i] ? {avg: sums[i]/counts[i], count: counts[i]} : {avg:null, count:0});
}
function fmtAllTime(stat){ return stat.avg===null ? '−' : `${stat.avg.toFixed(1)}位/${stat.count}`; }

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- render root ---------- */
function render(){
  document.getElementById('tabs').innerHTML = `
    <button data-tab="home" class="${currentView==='home'?'active':''}">対局情報</button>
    <button data-tab="score" class="${currentView==='score'?'active':''}">スコア入力</button>
    <button data-tab="archive" class="${currentView==='archive'?'active':''}">保存記録</button>
  `;
  document.querySelectorAll('#tabs button').forEach(b=> b.onclick=()=>{ currentView=b.dataset.tab; render(); });

  const bannerEl = document.getElementById('viewOnlyBanner');
  if(bannerEl) bannerEl.innerHTML = VIEW_ONLY ? `<div class="view-only-banner">👀 閲覧専用モードです（入力・保存はできません）</div>` : '';

  const app = document.getElementById('app');
  app.innerHTML = currentView==='home' ? renderHomeView() : (currentView==='score' ? renderScoreView() : renderArchiveView());
  attachHandlers();
  applyViewOnlyLock();
}

function applyViewOnlyLock(){
  if(!VIEW_ONLY) return;
  // 編集系input/selectを操作できないようにする（値は表示されたまま）
  document.querySelectorAll('.raw-input, .chip-count-input, #chipInsertRound, #chipInsertVal0, #chipInsertVal1, #chipInsertVal2, #name0, #name1, #name2, #rate, #savings, #saveTitleInput, #rangeFrom, #rangeTo, #importArea')
    .forEach(el=> el.disabled = true);
  // データを変更・削除するボタンは非表示にする
  document.querySelectorAll('#addChipBtn, #saveEntryBtn, #resetScoreBtn, #importBtn, .entry-del, .chip-del')
    .forEach(el=> el.style.display = 'none');
}

/* ---------- HOME VIEW ---------- */
function renderHomeView(){
  const playedCount = state.hanchans.filter(h=> h.vals.every(v=> v!==null && v!==undefined)).length;
  return renderSettings() + (VIEW_ONLY ? '' : renderBackupSection()) + `
  <div class="card">
    <h2>メニュー</h2>
    <div class="btn-row">
      <button class="btn btn-gold" id="goScoreBtn">スコア入力へ（入力済み ${playedCount}/33 回戦）</button>
      <button class="btn btn-primary" id="goArchiveBtn">保存記録を見る</button>
    </div>
  </div>`;
}

function renderBackupSection(){
  const exportData = JSON.stringify(state);
  return `
  <div class="card">
    <h2>データの引っ越し<span class="h2sub">別の端末やClaudeの共有版に移すとき用</span></h2>
    <details>
      <summary style="cursor:pointer;font-weight:700;font-size:12.5px;margin-bottom:8px;">① 今のデータをエクスポートする</summary>
      <p class="hint">下のテキストを全部コピーして、移動先アプリの「② 読み込む」欄に貼り付けてください。</p>
      <textarea id="exportArea" readonly style="width:100%;height:90px;font-size:10px;font-family:monospace;padding:6px;border:1px solid #d8cfb6;border-radius:6px;background:#fffdf8;box-sizing:border-box;">${escapeHtml(exportData)}</textarea>
      <div class="btn-row"><button class="btn btn-ghost btn-block" id="copyExportBtn">コピーする</button></div>
    </details>
    <details style="margin-top:10px;">
      <summary style="cursor:pointer;font-weight:700;font-size:12.5px;margin-bottom:8px;">② 別のデータを読み込む（上書き）</summary>
      <p class="hint">コピーしたテキストを下に貼り付けて「読み込む」を押すと、今のデータが丸ごと上書きされます。</p>
      <textarea id="importArea" placeholder="ここに貼り付け" style="width:100%;height:90px;font-size:10px;font-family:monospace;padding:6px;border:1px solid #d8cfb6;border-radius:6px;background:#fffdf8;box-sizing:border-box;"></textarea>
      <div class="btn-row"><button class="btn btn-primary btn-block" id="importBtn">読み込む（上書き）</button></div>
    </details>
  </div>`;
}

/* ---------- SCORE VIEW ---------- */
function renderScoreView(){
  return `<div class="layout-grid">
    <div class="col-left">
      <div class="title-signboard">
        <label for="saveTitleInput">タイトル</label>
        <input id="saveTitleInput" type="text" value="${escapeHtml(state.saveTitle||'')}" placeholder="例）2026年8月28日・闘牌開始">
      </div>
      ${renderTable()}
    </div>
    <div class="col-right">${renderTotalsPanel()}${VIEW_ONLY? '' : renderChips()+renderSaveSection()}</div>
  </div>`;
}

function renderSettings(){
  const avg = allTimeAverageStats();
  const names = state.players;
  return `
  <div class="card">
    <h2>対局情報</h2>
    <div class="topline">
      <div class="field"><label>レート（円/点）</label><input id="rate" type="number" step="1" value="${state.rate}"></div>
      <div class="field"><label>貯金（円/人）</label><input id="savings" type="number" step="100" value="${state.savingsPerPerson}"></div>
    </div>
    <div class="names-row">
      ${[0,1,2].map(i=>`
        <div class="name-box">
          <input id="name${i}" value="${escapeHtml(names[i])}">
          <div class="avg-rank-badge">通算平均 ${fmtAllTime(avg[i])}</div>
        </div>`).join('')}
    </div>
    <p class="hint">持ち点40,000点・3人打ち固定。素点は百点単位でそのまま入力できます。ポイント計算時のみ、2着・3着を5捨6入します（1着は素点そのまま）。ウマは2着の点数が40,000点未満なら+40/−15/−25、以上なら+30/−5/−25で自動判定します。</p>
  </div>`;
}

function renderTable(){
  const names = state.players;
  const ptTotals = [0,0,0];
  const rawTotals = [0,0,0];
  state.hanchans.forEach(h=>{
    const pts = computePoints(h.vals);
    pts.forEach((p,k)=>{ if(p!==null) ptTotals[k]+=p; });
    h.vals.forEach((v,k)=>{ if(v!==null && v!==undefined) rawTotals[k]+=v; });
  });

  // 日付タグの自動継承：1回目に設定したタグを、以降の入力済みの行にも自動で伝える
  let carryTag = null;
  const effectiveTags = state.hanchans.map(h=>{
    if(h.dateTag){ carryTag = h.dateTag; return h.dateTag; }
    const filled = h.vals.some(v=> v!==null && v!==undefined);
    return (filled && carryTag) ? carryTag : null;
  });

  function hanchanRows(h, i){
    const raws = h.vals;
    const pts = computePoints(raws);
    const filled = raws.filter(r=> r!==null && r!==undefined).length;
    const sum = raws.reduce((a,b)=> a + (b||0), 0);
    const warn = filled===3 && sum!==120000;
    const tagHTML = effectiveTags[i] ? `<span class="date-tag-badge">${escapeHtml(effectiveTags[i])}</span>` : '';
    const rawCells = [0,1,2].map(k=>{
      const val = raws[k];
      const isAuto = h.auto[k];
      const isLow = val!==null && val!==undefined && !isNaN(val) && val<40000;
      return `<td><input class="raw-input ${isAuto?'auto-filled':''} ${isLow?'val-low':''}" type="number" step="100" data-row="${i}" data-col="${k}" value="${val===null||val===undefined?'':val}" placeholder="—"></td>`;
    }).join('');
    const ptCells = [0,1,2].map(k=>{
      const pt = pts[k];
      const cls = pt===null?'zero':(pt>0?'pos':(pt<0?'neg':'zero'));
      return `<td class="${k===0?'pt-divider':''}"><span class="pt-badge ${cls}">${pt===null?'&nbsp;':fmt(pt)}</span></td>`;
    }).join('');
    return `<tr class="${warn?'row-warn':''}">
      <td class="date-cell" data-date-tag-row="${i}" title="クリックで日付を設定">${tagHTML}</td>
      <td class="idx">${i+1}${warn?' ⚠':''}</td>
      ${rawCells}${ptCells}
    </tr>`;
  }

  function chipRows(s, si, refDateTag){
    const tagHTML = refDateTag ? `<span class="date-tag-badge">${escapeHtml(refDateTag)}</span>` : '';
    const rawCells = [0,1,2].map(k=>{
      const c = s.chips[k];
      const delBtn = k===2 ? `<button class="chip-del no-print" data-chip-del="${si}" title="このChipを削除">×</button>` : '';
      return `<td class="chip-input-cell"><span class="chip-input-wrap">${delBtn}<input class="chip-count-input" type="number" step="1" data-chip-val="${si}-${k}" value="${c===null||c===undefined?'':c}" placeholder="枚"><span class="chip-unit">枚</span></span></td>`;
    }).join('');
    const ptCells = [0,1,2].map(k=>{
      const c = s.chips[k];
      const p = chipPointValue(c, s.round);
      const cls = p===null?'zero':(p>0?'pos':(p<0?'neg':'zero'));
      return `<td class="${k===0?'pt-divider':''}"><span class="pt-badge ${cls}">${p===null?'':fmt(p)}</span></td>`;
    }).join('');
    return `
    <tr class="chip-row-inline">
      <td class="date-cell">${tagHTML}</td>
      <td class="idx"><span class="chip-tag">Chip</span></td>
      ${rawCells}${ptCells}
    </tr>`;
  }

  // 半荘の間にChipの記録を差し込んで表示する（round=0は最初の行の前）。1行の中に素点とポイントを一緒に並べるので、行の高さは常に一致する。
  let rows = '';
  state.chipSessions.forEach((s,si)=>{ if(Number(s.round)===0){ rows += chipRows(s,si,null); } });
  state.hanchans.forEach((h,i)=>{
    rows += hanchanRows(h,i);
    state.chipSessions.forEach((s,si)=>{ if(Number(s.round)===i+1){ rows += chipRows(s,si,effectiveTags[i]); } });
  });

  const chipTotalsAll = chipPointTotals();
  const grandTotals = [0,1,2].map(i=> ptTotals[i]+chipTotalsAll[i]);

  return `
  <div class="card">
    <h2>半荘スコア（33回戦）<span class="h2sub">左＝素点入力／右＝自動ポイント換算</span></h2>
    <table class="score-table" id="scoreTable">
      <colgroup>
        <col style="width:7%"><col style="width:5%">
        <col style="width:16%"><col style="width:16%"><col style="width:16%">
        <col style="width:13.33%"><col style="width:13.33%"><col style="width:13.34%">
      </colgroup>
      <thead>
        <tr>
          <th class="th-date" rowspan="2">日付</th><th rowspan="2">#</th>
          <th colspan="3">素点</th><th colspan="3" class="pt-divider">ポイント</th>
        </tr>
        <tr>
          <th>${escapeHtml(names[0])}</th><th>${escapeHtml(names[1])}</th><th>${escapeHtml(names[2])}</th>
          <th class="pt-divider">${escapeHtml(names[0])}</th><th>${escapeHtml(names[1])}</th><th>${escapeHtml(names[2])}</th>
        </tr>
      </thead>
      <tbody id="scoreTableBody">${rows}</tbody>
    </table>
    <table class="score-totals-table">
      <tr>
        <td class="tfoot-label">ポイント合計（Chip込）</td>
        <td class="${grandTotals[0]>0?'pos':(grandTotals[0]<0?'neg':'')}">${fmt(grandTotals[0])}</td>
        <td class="${grandTotals[1]>0?'pos':(grandTotals[1]<0?'neg':'')}">${fmt(grandTotals[1])}</td>
        <td class="${grandTotals[2]>0?'pos':(grandTotals[2]<0?'neg':'')}">${fmt(grandTotals[2])}</td>
      </tr>
      <tr class="tfoot-yen">
        <td>円換算（×${Number(state.rate)||0}円）</td>
        <td>${fmt(grandTotals[0]*(Number(state.rate)||0))}円</td>
        <td>${fmt(grandTotals[1]*(Number(state.rate)||0))}円</td>
        <td>${fmt(grandTotals[2]*(Number(state.rate)||0))}円</td>
      </tr>
    </table>
    <p class="hint">⚠ の行は3人の素点合計が120,000点になっていません。Chipは下の「Chipを差し込む」から好きな回戦の直後に追加できます（役満が出た時やその日の終わりなど）。</p>
  </div>`;
}

let expandedEntries = new Set(); // "folderIdx-entryIdx" のセット。展開中の保存を記憶する（再描画で消えないように）

function renderEntryDetail(entry){
  const names = entry.players || state.players;
  const hanchans = entry.hanchans || [];
  const chipSessions = entry.chipSessions || [];
  const rate = Number(entry.rate)||0;
  const played = (h)=> h.vals.some(v=> v!==null && v!==undefined);

  // 日付タグの自動継承（スコア入力ページと同じロジック）
  let carryTag = null;
  const effectiveTags = hanchans.map(h=>{
    if(h.dateTag){ carryTag = h.dateTag; return h.dateTag; }
    const filled = played(h);
    return (filled && carryTag) ? carryTag : null;
  });

  function hanchanRows(h, i){
    if(!played(h)) return '';
    const raws = h.vals;
    const pts = computePoints(raws);
    const filled = raws.filter(r=> r!==null && r!==undefined).length;
    const sum = raws.reduce((a,b)=> a + (b||0), 0);
    const warn = filled===3 && sum!==120000;
    const tagHTML = effectiveTags[i] ? `<span class="date-tag-badge">${escapeHtml(effectiveTags[i])}</span>` : '';
    const rawCells = [0,1,2].map(k=>{
      const val = raws[k];
      const isAuto = h.auto && h.auto[k];
      const isLow = val!==null && val!==undefined && !isNaN(val) && val<40000;
      return `<td><span class="pt-badge ${isLow?'neg':''}" style="${isAuto?'font-style:italic;':''}">${val===null||val===undefined?'—':fmtAbs(val)}</span></td>`;
    }).join('');
    const ptCells = [0,1,2].map(k=>{
      const pt = pts[k];
      const cls = pt===null?'zero':(pt>0?'pos':(pt<0?'neg':'zero'));
      return `<td class="${k===0?'pt-divider':''}"><span class="pt-badge ${cls}">${pt===null?'&nbsp;':fmt(pt)}</span></td>`;
    }).join('');
    return `<tr class="${warn?'row-warn':''}">
      <td class="date-cell">${tagHTML}</td>
      <td class="idx">${i+1}${warn?' ⚠':''}</td>
      ${rawCells}${ptCells}
    </tr>`;
  }

  function chipRows(s, refDateTag){
    const tagHTML = refDateTag ? `<span class="date-tag-badge">${escapeHtml(refDateTag)}</span>` : '';
    const rawCells = [0,1,2].map(k=>{
      const c = s.chips[k];
      return `<td><span class="pt-badge">${c===null||c===undefined?'':fmtAbs(c)+'枚'}</span></td>`;
    }).join('');
    const ptCells = [0,1,2].map(k=>{
      const c = s.chips[k];
      const p = chipPointValue(c, s.round);
      const cls = p===null?'zero':(p>0?'pos':(p<0?'neg':'zero'));
      return `<td class="${k===0?'pt-divider':''}"><span class="pt-badge ${cls}">${p===null?'':fmt(p)}</span></td>`;
    }).join('');
    return `
    <tr class="chip-row-inline">
      <td class="date-cell">${tagHTML}</td>
      <td class="idx"><span class="chip-tag">Chip</span></td>
      ${rawCells}${ptCells}
    </tr>`;
  }

  // 半荘の間にChipの記録を差し込んで表示する（スコア入力ページと同じ並び）。1行に素点とポイントを一緒に並べるので高さは常に一致する。
  let rows = '';
  chipSessions.forEach(s=>{ if(Number(s.round)===0){ rows += chipRows(s,null); } });
  hanchans.forEach((h,i)=>{
    rows += hanchanRows(h,i);
    chipSessions.forEach(s=>{ if(Number(s.round)===i+1){ rows += chipRows(s,effectiveTags[i]); } });
  });

  const pTot = pointsTotals(hanchans);
  const cTot = chipPointTotals(chipSessions);
  const grandTotals = [0,1,2].map(i=> pTot[i]+cTot[i]);

  const hasAny = rows.trim()!=='';

  return `
  <div class="entry-detail">
    ${hasAny ? `
    <table class="score-table">
      <colgroup>
        <col style="width:7%"><col style="width:5%">
        <col style="width:16%"><col style="width:16%"><col style="width:16%">
        <col style="width:13.33%"><col style="width:13.33%"><col style="width:13.34%">
      </colgroup>
      <thead>
        <tr>
          <th class="th-date" rowspan="2">日付</th><th rowspan="2">#</th>
          <th colspan="3">素点</th><th colspan="3" class="pt-divider">ポイント</th>
        </tr>
        <tr>
          <th>${escapeHtml(names[0])}</th><th>${escapeHtml(names[1])}</th><th>${escapeHtml(names[2])}</th>
          <th class="pt-divider">${escapeHtml(names[0])}</th><th>${escapeHtml(names[1])}</th><th>${escapeHtml(names[2])}</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <table class="score-totals-table">
      <tr>
        <td class="tfoot-label">ポイント合計（Chip込）</td>
        <td class="${grandTotals[0]>0?'pos':(grandTotals[0]<0?'neg':'')}">${fmt(grandTotals[0])}</td>
        <td class="${grandTotals[1]>0?'pos':(grandTotals[1]<0?'neg':'')}">${fmt(grandTotals[1])}</td>
        <td class="${grandTotals[2]>0?'pos':(grandTotals[2]<0?'neg':'')}">${fmt(grandTotals[2])}</td>
      </tr>
      <tr class="tfoot-yen">
        <td>円換算（×${rate}円）</td>
        <td>${fmt(grandTotals[0]*rate)}円</td>
        <td>${fmt(grandTotals[1]*rate)}円</td>
        <td>${fmt(grandTotals[2]*rate)}円</td>
      </tr>
    </table>` : `<p class="hint" style="text-align:center;">記録がありません</p>`}
  </div>`;
}

/* ---------- handlers ---------- */
function attachHandlers(){
  const byId = id=> document.getElementById(id);
  if(byId('goScoreBtn')) byId('goScoreBtn').onclick = ()=>{ currentView='score'; render(); };
  if(byId('goArchiveBtn')) byId('goArchiveBtn').onclick = ()=>{ currentView='archive'; render(); };
  if(byId('rate')) byId('rate').onchange = e=>{ state.rate = Number(e.target.value)||0; saveState(); render(); };
  if(byId('savings')) byId('savings').onchange = e=>{ state.savingsPerPerson = Number(e.target.value)||0; saveState(); render(); };
  [0,1,2].forEach(i=>{
    const el = byId('name'+i);
    if(el) el.onchange = e=>{ state.players[i]=e.target.value||state.players[i]; saveState(); render(); };
  });

  if(byId('rangeFrom')) byId('rangeFrom').onchange = e=>{ state.todayRange.from = Number(e.target.value)||1; saveState(); render(); };
  if(byId('rangeTo')) byId('rangeTo').onchange = e=>{ state.todayRange.to = Number(e.target.value)||ROWS; saveState(); render(); };

  document.querySelectorAll('.raw-input').forEach(inp=>{
    inp.onchange = e=>{
      const row = parseInt(e.target.dataset.row), col = parseInt(e.target.dataset.col);
      let v = e.target.value===''? null : Number(e.target.value);
      const h = state.hanchans[row];
      h.vals[col] = (v!==null && !isNaN(v)) ? v : null;
      h.auto[col] = false;
      recalcRow(row);
      saveState();
      render();
      // 3人分そろった（トップが自動計算で決まった）ら、その回戦のポイントを自動で読み上げる
      if(h.vals.every(x=> x!==null && x!==undefined)){
        const pts = computePoints(h.vals);
        let text = pointsToSpeechText(state.players, pts);
        if(row===31){ text += 'ハイッ！次は33回戦目！ファイナルです！皆さん頑張ってください！！'; } // 32回戦目の後だけ特別メッセージ
        speakText(text);
      }
    };
    inp.onkeydown = e=>{
      if(e.key !== 'Enter') return;
      e.preventDefault();
      const row = parseInt(e.target.dataset.row), col = parseInt(e.target.dataset.col);
      const nextRow = row, nextCol = (col+1) % 3; // 同じ行の中でループ（佐々木→村上→小林→佐々木…）
      e.target.blur(); // 値が変わっていればここでonchangeが走り、再描画される
      setTimeout(()=>{
        const nextInput = document.querySelector(`.raw-input[data-row="${nextRow}"][data-col="${nextCol}"]`);
        if(nextInput) nextInput.focus();
      }, 0);
    };
  });

  document.querySelectorAll('[data-date-tag-row]').forEach(td=>{
    td.onclick = ()=>{
      const row = parseInt(td.dataset.dateTagRow);
      const h = state.hanchans[row];
      const cur = h.dateTag || '';
      const next = prompt(`${row+1}回戦の日付タグ（例：8/16／空欄で削除）`, cur);
      if(next===null) return; // キャンセル
      h.dateTag = next.trim()===''? null : next.trim();
      saveState(); render();
    };
  });

  if(byId('addChipBtn')) byId('addChipBtn').onclick = ()=>{
    const roundVal = byId('chipInsertRound').value;
    if(roundVal===''){ alert('何回戦の直後に挿入するか入力してください（開始前なら0）'); return; }
    const round = Number(roundVal);
    if(isNaN(round) || round<0 || round>33){ alert('回戦は0〜33の範囲で入力してください'); return; }
    const chips = [0,1,2].map(i=>{
      const v = byId('chipInsertVal'+i).value;
      return v===''? null : Number(v);
    });
    state.chipSessions.push({round, chips});
    saveState(); render();
  };
  if(byId('chipInsertRound')) byId('chipInsertRound').onkeydown = e=>{
    if(e.key !== 'Enter') return;
    e.preventDefault();
    const next = byId('chipInsertVal0');
    if(next) next.focus();
  };
  [0,1].forEach(i=>{
    const el = byId('chipInsertVal'+i);
    if(el) el.onkeydown = e=>{
      if(e.key !== 'Enter') return;
      e.preventDefault();
      const next = byId('chipInsertVal'+(i+1));
      if(next) next.focus();
    };
  });
  if(byId('chipInsertVal2')) byId('chipInsertVal2').onkeydown = e=>{
    if(e.key !== 'Enter') return;
    e.preventDefault();
    e.target.blur();
    if(byId('addChipBtn')) byId('addChipBtn').click(); // 最後まで来たらそのまま差し込み実行
  };
  document.querySelectorAll('[data-chip-val]').forEach(inp=>{
    inp.onchange = e=>{
      const [i,k] = e.target.dataset.chipVal.split('-').map(Number);
      const v = e.target.value===''? null : Number(e.target.value);
      state.chipSessions[i].chips[k]=v;
      saveState(); render();
    };
  });
  document.querySelectorAll('[data-chip-del]').forEach(btn=>{
    btn.onclick = ()=>{ const i=parseInt(btn.dataset.chipDel); state.chipSessions.splice(i,1); saveState(); render(); };
  });

  if(byId('saveTitleInput')) byId('saveTitleInput').onchange = e=>{ state.saveTitle = e.target.value; saveState(); };
  if(byId('saveEntryBtn')) byId('saveEntryBtn').onclick = saveEntry;
  if(byId('resetScoreBtn')) byId('resetScoreBtn').onclick = resetScore;
  if(byId('speakResultBtn')) byId('speakResultBtn').onclick = ()=>{
    const pTot = pointsTotals(state.hanchans);
    const cTot = chipPointTotals(state.chipSessions);
    const gTot = [0,1,2].map(i=> pTot[i]+cTot[i]);
    speakText(pointsToSpeechText(state.players, gTot));
  };
  document.querySelectorAll('.entry-speak').forEach(btn=>{
    btn.onclick = ()=>{
      const data = JSON.parse(decodeURIComponent(btn.dataset.speak));
      speakText(pointsToSpeechText(data.names, data.totals));
    };
  });

  if(byId('copyExportBtn')) byId('copyExportBtn').onclick = ()=>{
    const ta = byId('exportArea');
    ta.select(); ta.setSelectionRange(0, 999999);
    let ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){ /* ignore */ }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value)
        .then(()=> alert('コピーしました。移動先アプリの「② 読み込む」欄に貼り付けてください。'))
        .catch(()=> alert(ok ? 'コピーしました。' : 'コピーできませんでした。テキストを選択して手動でコピーしてください。'));
    } else {
      alert(ok ? 'コピーしました。' : 'コピーできませんでした。テキストを選択して手動でコピーしてください。');
    }
  };
  if(byId('importBtn')) byId('importBtn').onclick = ()=>{
    const raw = (byId('importArea').value||'').trim();
    if(!raw){ alert('貼り付けるデータがありません。'); return; }
    let obj;
    try{ obj = JSON.parse(raw); }catch(e){ alert('データの形式が正しくありません。コピーしたテキストをそのまま貼り付けてください。'); return; }
    if(!obj || !Array.isArray(obj.hanchans) || !Array.isArray(obj.players)){ alert('このデータは読み込めない形式です。'); return; }
    if(!confirm('今のデータを、貼り付けた内容で上書きします。よろしいですか？')) return;
    state = obj;
    state.hanchans = (state.hanchans||[]).map(r=> Array.isArray(r) ? {vals:r, auto:[false,false,false]} : r);
    while(state.hanchans.length < ROWS) state.hanchans.push({vals:[null,null,null], auto:[false,false,false]});
    state.chipSessions = state.chipSessions || [];
    state.chipSessions.forEach(s=>{ if(s.round===undefined) s.round=''; });
    state.todayRange = state.todayRange || {from:1, to:ROWS};
    state.saveTitle = state.saveTitle || '';
    state.folders = state.folders || [];
    saveState();
    alert('読み込みました。');
    render();
  };
  document.querySelectorAll('[data-folder-idx]').forEach(btn=>{
    btn.onclick = async ()=>{
      const fi = Number(btn.dataset.folderIdx), ei = Number(btn.dataset.entryIdx);
      if(!confirm('この保存を削除しますか？')) return;
      expandedEntries.delete(`${fi}-${ei}`);
      state.folders[fi].entries.splice(ei,1);
      if(state.folders[fi].entries.length===0) state.folders.splice(fi,1);
      await saveState(); render();
    };
  });
  document.querySelectorAll('[data-toggle-key]').forEach(el=>{
    el.onclick = ()=>{
      const key = el.dataset.toggleKey;
      if(expandedEntries.has(key)) expandedEntries.delete(key); else expandedEntries.add(key);
      render();
    };
  });
}

function recalcRow(row){
  const h = state.hanchans[row];
  const manualIdx = [0,1,2].filter(i=> h.vals[i]!==null && h.vals[i]!==undefined && !h.auto[i]);
  if(manualIdx.length===2){
    const missing = [0,1,2].find(i=> !manualIdx.includes(i));
    h.vals[missing] = 120000 - h.vals[manualIdx[0]] - h.vals[manualIdx[1]];
    h.auto[missing] = true;
  } else if(manualIdx.length<2){
    [0,1,2].forEach(i=>{ if(h.auto[i]){ h.vals[i]=null; h.auto[i]=false; } });
  }
}

/* ---------- 読み上げ（音声） ---------- */
function pointsToSpeechText(names, totals){
  return names.map((n,i)=>{
    const v = Math.round(totals[i]);
    const sign = v>0 ? 'プラス' : (v<0 ? 'マイナス' : '');
    return `${n}さん、${sign}${Math.abs(v)}ポイントです。`;
  }).join('');
}
function speakText(text){
  if(!('speechSynthesis' in window)){ alert('お使いのブラウザは音声読み上げに対応していません。'); return; }
  window.speechSynthesis.cancel(); // 前の読み上げが残っていたら止めてから話す
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ja-JP';
  utter.rate = 1.0;
  window.speechSynthesis.speak(utter);
}

/* ---------- reset (次の対局へ) ---------- */
async function resetScore(){
  if(!confirm('スコア表をリセットします。保存していない入力内容は消えますが、よろしいですか？（保存済みの記録は消えません）')) return;
  state.hanchans = Array.from({length:ROWS}, ()=> ({vals:[null,null,null], auto:[false,false,false]}));
  state.chipSessions = [];
  state.todayRange = {from:1, to:ROWS};
  state.saveTitle = '';
  await saveState();
  render();
}

/* ---------- save (day entry / set archive) ---------- */
/* ---------- save (title folder) ---------- */
async function saveEntry(){
  const title = (state.saveTitle||'').trim();
  if(!title){ alert('保存する前に、表の上の「タイトル」欄に名前を入力してください。'); return; }

  const entry = {
    savedAt: new Date().toLocaleString('ja-JP'),
    players: [...state.players],
    hanchans: JSON.parse(JSON.stringify(state.hanchans)),
    chipSessions: JSON.parse(JSON.stringify(state.chipSessions)),
    rate: state.rate, savingsPerPerson: state.savingsPerPerson
  };

  state.folders = state.folders || [];
  let folder = state.folders.find(f=> f.title===title);
  if(folder){
    folder.entries.push(entry);
  } else {
    folder = {title, entries: [entry]};
    state.folders.unshift(folder);
  }

  await saveState();
  alert(`「${title}」フォルダに保存しました（${folder.entries.length}件目）。`);
  render();
}

loadState();
</script>
